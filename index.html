<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gametest2 · A&A 1942 map</title>
<style>
  body{margin:0;background:#0b1d33;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
  #top{font-size:26px;font-weight:700;margin-top:8px;display:flex;gap:22px}
  #view{width:min(98vw,1500px);aspect-ratio:3500/2000;margin-top:8px;border:3px solid #fff3;border-radius:6px;overflow:hidden;background:#3b78b0;touch-action:none}
  svg{width:100%;height:100%;display:block;cursor:grab}
  .sea{fill:#4a86bf;stroke:#cfe6ff99;stroke-width:1.5}
  .land{stroke:#111;stroke-width:2;stroke-linejoin:round}
  .t:hover{filter:brightness(1.25)}
  .szn{fill:#e8f3ffcc;font-size:22px;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
  .ipc circle{fill:#fff;stroke:#111;stroke-width:2}
  .ipc text{font-size:18px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#111}
  .ipc,.star{pointer-events:none}
  .star{font-size:46px;text-anchor:middle;dominant-baseline:middle}
  .legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px;font-size:22px}
  .legend span{display:flex;align-items:center;gap:6px;background:#ffffff14;border-radius:10px;padding:4px 10px}
  .legend i{width:22px;height:22px;border-radius:5px;display:inline-block;border:2px solid #000a}
  #tip{position:fixed;pointer-events:none;background:#000d;padding:5px 9px;border-radius:6px;font-size:15px;display:none}
</style>
</head>
<body>
<div id="top"><span id="cl"></span><span id="cs"></span></div>
<div id="view"><svg id="map" viewBox="0 0 3500 2000"></svg></div>
<div class="legend" id="legend"></div>
<div id="tip"></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
// Axis & Allies 1942 (2nd Ed.) board: 96 land territories (incl. 16 neutrals) + 65 sea zones.
// Shapes from TripleA "World War II v5 1942" map (polygons.txt), simplified.
const P = {
  GER:{c:'#6f6f6f', ic:'🇩🇪'}, JPN:{c:'#e8a23a', ic:'🇯🇵'}, SOV:{c:'#9b2d24', ic:'☭'},
  UK:{c:'#c9a86a', ic:'🇬🇧'},  USA:{c:'#5d7f3a', ic:'🇺🇸'}, CHN:{c:'#3e8a7a', ic:'🇨🇳'},
  NEU:{c:'#e9dfc0', ic:'🚫'},
};
const svg = d3.select('#map'), g = svg.append('g'), tip = document.getElementById('tip');
d3.json('board.json').then(B => {
  const sea = B.filter(t => t.sz), land = B.filter(t => !t.sz);
  document.getElementById('cl').textContent = '🟫 ' + land.length;
  document.getElementById('cs').textContent = '🌊 ' + sea.length;
  const show = (e, txt) => { tip.style.display = 'block'; tip.textContent = txt;
    tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; };
  const hide = () => tip.style.display = 'none';
  const draw = (arr, cls, fill, label) => g.append('g').selectAll('path').data(arr).join('path')
    .attr('class', cls + ' t').attr('d', t => t.d).attr('fill', fill)
    .on('pointermove', (e, t) => show(e, label(t))).on('pointerleave', hide)
    .on('click', (e, t) => show(e, label(t)));
  draw(sea, 'sea', null, t => '🌊 ' + t.sz);
  draw(land, 'land', t => P[t.o].c, t => P[t.o].ic + ' ' + t.n + (t.ipc ? '  💰' + t.ipc : '') + (t.vc ? '  🏙️' : ''));
  g.append('g').selectAll('text').data(sea).join('text').attr('class', 'szn')
    .attr('x', t => t.c[0]).attr('y', t => t.c[1]).text(t => t.sz);
  const ipc = g.append('g').selectAll('g').data(land.filter(t => t.ipc > 0)).join('g').attr('class', 'ipc')
    .attr('transform', t => `translate(${t.c[0] + 16},${t.c[1] + 16})`);
  ipc.append('circle').attr('r', 14); ipc.append('text').text(t => t.ipc);
  g.append('g').selectAll('text').data(land.filter(t => t.cap)).join('text').attr('class', 'star')
    .attr('x', t => t.cap[0] + 20).attr('y', t => t.cap[1] + 20).text('⭐');
  svg.call(d3.zoom().scaleExtent([1, 12]).translateExtent([[0, 0], [3500, 2000]])
    .on('zoom', e => { g.attr('transform', e.transform); hide(); }));
  const cnt = {}; land.forEach(t => cnt[t.o] = (cnt[t.o] || 0) + 1);
  document.getElementById('legend').innerHTML = Object.entries(P).map(([k, p]) =>
    `<span><i style="background:${p.c}"></i>${p.ic} ${cnt[k] || 0}</span>`).join('') +
    '<span>⭐ capital</span><span><i style="background:#fff;border-radius:50%"></i>💰 IPC</span>';
});
</script>
</body>
</html>
